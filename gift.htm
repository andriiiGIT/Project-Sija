<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a3a;--pink:#ff4f7b;--sun:#ffc933;--mint:#3ddbb0;--violet:#7a5cff;--bg:#f3efff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "DM Sans",system-ui,sans-serif;padding:0 16px 64px;overflow-x:hidden}
h1,h2,button,.display{font-family:Fredoka,"Trebuchet MS",sans-serif}
h1{font-size:clamp(2.4rem,10vw,4rem);line-height:1.05;margin:0}
h2{font-size:1.5rem;margin:0}
.name{display:block;color:var(--pink);font-size:clamp(2.8rem,12vw,5rem)}
main{max-width:620px;margin:0 auto;display:none}
body.open main{display:block}
body.open #intro{display:none}
.view{display:none}
.view.show{display:block}
.center{text-align:center}
p{margin:0 0 12px}

button{font-size:1.05rem;font-weight:700;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:10px 24px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button:focus-visible,.like:focus-visible,.cover:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
button.plain{background:none;border:0;box-shadow:none;border-radius:0;padding:0;width:100%;text-align:left;transform:none}

/* slide-down helper: wrapper grid animates 0fr -> 1fr */
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}
.slide>.in{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .4s}
.open>.slide,.slide.open{grid-template-rows:1fr}
.open>.slide>.in,.slide.open>.in{visibility:visible;transition-delay:0s}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:5;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:10px;text-align:center}
.stage{position:relative;width:min(78vw,280px);aspect-ratio:1}
.stage svg{width:100%;height:100%;overflow:visible;display:block}
.stage .item{position:absolute;inset:0;transition:transform .45s,opacity .35s}
#boxbtn{background:none;border:0;box-shadow:none;padding:0;border-radius:0;animation:wiggle 1.6s ease-in-out infinite}
#boxbtn:hover,#boxbtn:active{box-shadow:none;transform:none}
#boxbtn.out{transform:scale(.1) rotate(25deg);opacity:0;pointer-events:none;animation:none}
#env{transform:scale(.1) rotate(-25deg);opacity:0;pointer-events:none;transition-delay:.25s}
#env.in{transform:none;opacity:1;pointer-events:auto;cursor:pointer}
#flap{transform-origin:100px 50px;transition:transform .45s}
#env.opened #flap{transform:scaleY(-1)}
#heart{position:absolute;left:50%;top:59%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);background:none;border:0;box-shadow:none;padding:0;border-radius:0;animation:beat 1.2s ease-in-out infinite;transition:opacity .3s}
#heart:hover,#heart:active{box-shadow:none;transform:translate(-50%,-50%)}
#heart svg{width:100%;height:100%}
#env.opened #heart{opacity:0;animation:none}
#hint{font-family:Fredoka,sans-serif;font-size:1.35rem;font-weight:700;margin:0}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}90%{transform:rotate(-4deg)}}
@keyframes beat{0%,100%{scale:1}50%{scale:1.18}}

/* ---------- view 1 ---------- */
.hero{text-align:center;padding:44px 0 30px}
.gallery{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 46px;margin:0 0 64px}
.frame{margin:0;background:#fff;border:3px solid var(--ink);border-radius:8px;padding:5px 5px 14px;box-shadow:3px 3px 0 var(--ink);cursor:zoom-in;transition:transform .25s;transform:rotate(var(--r,0deg));position:relative}
.frame:nth-of-type(1){--r:-4deg;transform-origin:0 0}
.frame:nth-of-type(2){--r:2deg;margin-top:14px;transform-origin:50% 0}
.frame:nth-of-type(3){--r:-2deg;transform-origin:100% 0}
.frame.zoom{transform:scale(2.2) rotate(0);z-index:6;cursor:zoom-out}
.ph{aspect-ratio:4/5;background:repeating-linear-gradient(45deg,#ffe9f0,#ffe9f0 8px,#fff 8px,#fff 16px);display:grid;place-items:center;text-align:center;font-size:.7rem;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame figcaption{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:.6rem;line-height:1.2}
.bq{position:absolute;bottom:-28px;width:62px;pointer-events:none}
.bq.l{left:-4px;transform:scaleX(-1)}
.bq.r{right:-4px}
.go small{display:block;margin-top:10px;opacity:.75}
@media(min-width:560px){.gallery{padding:0 124px;gap:12px}.bq{width:108px;bottom:-36px}.bq.l{left:0}.bq.r{right:0}.ph{font-size:.85rem}.frame figcaption{font-size:.8rem}.frame{padding-bottom:22px}}

/* ---------- view 2 ---------- */
.back{font-size:.95rem;padding:6px 16px;margin:24px 0 0}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:20px 22px;margin:26px 0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.head small{display:block;font-family:"DM Sans",sans-serif;font-weight:400;font-size:.85rem;opacity:.7}
.chev{font-size:1.4rem;transition:transform .3s}
.card.open .chev{transform:rotate(180deg)}
.pad{padding-top:16px}

/* likes: true / false */
.likes{display:grid;gap:10px}
.like{background:var(--bg);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;font-weight:500;cursor:pointer}
.like .acts{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s}
.like:hover .acts,.like:focus-within .acts,.like.active .acts{grid-template-rows:1fr}
.like .acts>div{overflow:hidden;min-height:0;display:flex;gap:10px;padding-top:0}
.like:hover .acts>div,.like:focus-within .acts>div,.like.active .acts>div{padding-top:10px}
.like .acts button{padding:5px 18px;font-size:.95rem}
.like .t{background:#3ddb7a}
.like .f{background:#ff5252;color:#fff}
.like.done .acts{display:none}
.res{font-family:Fredoka,sans-serif;font-size:1.3rem;font-weight:700;margin-top:6px}
.res:empty{display:none}
.res.yes{color:#0f9d58}
.res.no{color:#e0344f}

/* music under swipe layer */
.musicwrap{position:relative;border-radius:20px;overflow:hidden;margin-top:18px}
.cover{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;padding:12px;background:repeating-linear-gradient(45deg,var(--pink),var(--pink) 14px,#ff7a9c 14px,#ff7a9c 28px);border:3px solid var(--ink);border-radius:20px;color:#fff;font-family:Fredoka,sans-serif;font-size:1.25rem;font-weight:700;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;text-shadow:0 2px 0 var(--ink)}
.cover span{display:block;font-size:2rem;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(10px)}}
.player{display:flex;gap:18px;align-items:center;background:var(--ink);color:#fff;border-radius:20px;padding:18px;min-height:132px}
.disc{flex:none;width:92px;height:92px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle,var(--pink) 0 14%,var(--ink) 15% 22%,#2c2857 23% 34%,var(--ink) 35% 45%,#2c2857 46% 58%,var(--ink) 59%)}
.disc.spin{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.player .t{font-family:Fredoka,sans-serif;font-size:1.2rem;font-weight:700}
.player .a{opacity:.8;margin-bottom:10px}
.player button{background:var(--mint)}
#musicmsg{font-size:.9rem;color:#b3281f;min-height:1.4em;margin-top:6px}

/* memories */
.qs{display:grid;gap:12px}
.mem{border:3px solid var(--ink);border-radius:16px;background:var(--sun);overflow:hidden}
.mem .mq{padding:14px 18px;font-weight:500;font-size:1.1rem}
.mem .ans{background:#fff;border-top:3px solid var(--ink);padding:14px 18px}
.mem.open .mq .chev{transform:rotate(180deg)}

/* main present */
.pframe{background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:8px;max-width:320px;margin:6px auto 14px}
.pframe .ph{aspect-ratio:1;font-size:.9rem}
.big{font-family:Fredoka,sans-serif;font-size:1.5rem;font-weight:700;text-align:center}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#no{background:var(--pink);color:#fff}

/* final */
.end{padding:80px 12px 40px;text-align:center}
.end p{font-family:Fredoka,sans-serif;font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.35;font-weight:500;max-width:22ch;margin:0 auto 18px}
.end .heart{color:var(--pink);font-size:2.4rem}

canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
@media(prefers-reduced-motion:reduce){#boxbtn,#heart,.disc.spin,.cover span{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

      <ellipse cx="90" cy="88" rx="17" ry="7" transform="rotate(50 90 88)" fill="#3ddbb0" stroke="#1d1a3a" stroke-width="2"/>
      <g stroke="#1d1a3a" stroke-width="2.5" stroke-linejoin="round" fill="#ffc933">

</svg>

<!-- INTRO -->
<section id="intro">
  <div class="stage">
    <button class="item" id="boxbtn" aria-label="Open the box">
      <svg viewBox="0 0 200 200" aria-hidden="true" stroke="#1d1a3a" stroke-width="4" stroke-linejoin="round">
        <rect x="30" y="85" width="140" height="90" rx="6" fill="#ff4f7b"/>

        <circle cx="100" cy="55" r="8" fill="#ffc933"/>

    </button>
    <div class="item" id="env">
      <svg viewBox="0 0 200 200" aria-hidden="true" stroke="#1d1a3a" stroke-width="4" stroke-linejoin="round">
        <rect x="15" y="50" width="170" height="120" rx="8" fill="#3ddbb0"/>
        <polyline points="15,170 100,105 185,170" fill="none"/>
        <g id="flap"><polygon points="15,50 185,50 100,118" fill="#ffe07a"/></g>
      </svg>

      </button>
    </div>
  </div>
  <p id="hint">Ada sesuatu nih buat luu. Pencet Kotaknyaa!</p>
</section>

<main>
  <!-- VIEW 1: photos -->
  <section class="view show" id="v1">
    <header class="hero"><h1>Happy Birthday<span class="name" id="name"></span></h1></header>
    <div class="gallery" id="gallery">
      <svg class="bq l" viewBox="0 0 120 200" aria-hidden="true"><use href="#bouquet"/></svg>

    <div class="center go">
      <button id="go">Pencet nii</button>
      <small>(aseli ini bukan virus)</small>
    </div>
  </section>

  <!-- VIEW 2: tap each part to open it -->
  <section class="view" id="v2">
    <button class="back" id="back">← Balik kephotonyAaa</button>

    <div class="card">
      <button class="plain head"><h2>Ucapan kecil<small>Tap to open</small></h2><span class="chev">▾</span></button>

    <div class="card">

</main>

/* ======================================================== */

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

$('name').textContent = CONFIG.name;
$('from').textContent = CONFIG.from;
$('note').textContent = CONFIG.note;

/* load a picture into a .ph box, keep placeholder if it's missing */
function loadPic(box, src, alt){
  if (!src) return;
  const img = new Image(); img.alt = alt || '';
  img.onload = () => box.appendChild(img);
  img.src = src;
}

/* photo frames (tap to zoom) */
CONFIG.photos.slice(0, 3).forEach(p => {
  const f = document.createElement('figure');
  f.className = 'frame';
  f.innerHTML = '<div class="ph"><span>📷<br>Your photo here</span></div><figcaption></figcaption>';
  f.querySelector('figcaption').textContent = p.caption || '';
  loadPic(f.querySelector('.ph'), p.src, p.caption || 'Photo');
  f.onclick = () => {
    const was = f.classList.contains('zoom');
    document.querySelectorAll('.frame.zoom').forEach(x => x.classList.remove('zoom'));
    if (!was) f.classList.add('zoom');
  };
  $('gallery').insertBefore(f, $('gallery').querySelector('.bq.r'));
});
loadPic($('presentph'), CONFIG.present.src, 'Your present');

/* tap-to-open parts */
document.querySelectorAll('.card > .head').forEach(h => {
  h.setAttribute('aria-expanded', 'false');
  h.onclick = () => {
    const open = h.parentElement.classList.toggle('open');
    h.setAttribute('aria-expanded', open);
    h.querySelector('small').textContent = open ? 'Tap to close' : 'Tap to open';
  };
});

/* likes: true / false */
CONFIG.likes.forEach(text => {
  const d = document.createElement('div');
  d.className = 'like'; d.tabIndex = 0;
  d.innerHTML = '<div class="stmt"></div><div class="acts"><div><button class="t">true</button><button class="f">false</button></div></div><div class="res"></div>';
  d.querySelector('.stmt').textContent = text;
  const res = d.querySelector('.res');
  d.onclick = () => d.classList.toggle('active');
  const answer = (ok, msg) => e => {
    e.stopPropagation();
    d.classList.add('done'); res.textContent = msg; res.className = 'res ' + (ok ? 'yes' : 'no');
  };
  d.querySelector('.t').onclick = answer(true, 'YESSS');
  d.querySelector('.f').onclick = answer(false, 'ill try better :v');
  $('likes').appendChild(d);
});

/* memories: frame slides down to show the answer */
CONFIG.memories.forEach(m => {
  const d = document.createElement('div');
  d.className = 'mem';
  d.innerHTML = '<button class="plain mq head"><span></span><span class="chev">▾</span></button><div class="slide"><div class="in"><div class="ans"></div></div></div>';
  d.querySelector('.mq span').textContent = m.q;
  d.querySelector('.ans').textContent = m.a;
  d.querySelector('.mq').onclick = () => d.classList.toggle('open');
  $('qs').appendChild(d);
});

/* confetti */
const cv = $('c'), cx = cv.getContext('2d');
let P = [], raf = 0;
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
resize(); addEventListener('resize', resize);
function boom(){
  if (reduced) return;
  const cols = ['#ff4f7b','#ffc933','#3ddbb0','#7a5cff','#ffffff'];
  for (let i = 0; i < 150; i++) P.push({
    x: innerWidth/2, y: innerHeight*.45,
    vx: (Math.random()-.5)*16, vy: Math.random()*-14-3,
    s: 6+Math.random()*7, r: Math.random()*6, vr: (Math.random()-.5)*.4, c: cols[i%5]
  });
  if (!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  P = P.filter(p => p.y < cv.height+20);
  P.forEach(p => {
    p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();
  });
  raf = P.length ? requestAnimationFrame(loop) : 0;
  if (!raf) cx.clearRect(0,0,cv.width,cv.height);
}

/* intro */
$('boxbtn').onclick = () => {
  $('boxbtn').classList.add('out');
  $('env').classList.add('in');
  $('hint').textContent = 'Pencett Surattnyaa!';
};
$('env').onclick = () => {
  const e = $('env');
  if (!e.classList.contains('in') || e.classList.contains('opened')) return;
  e.classList.add('opened');
  setTimeout(() => { document.body.classList.add('open'); scrollTo(0,0); boom(); }, 550);
};

/* views */
function show(id){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('show', v.id === id));
  scrollTo(0,0);
}
$('go').onclick = () => show('v2');
$('back').onclick = () => show('v1');

/* swipe layer that hides the music */
(function(){
  const cov = $('cover'), wrap = cov.parentElement;
  let sx = 0, dx = 0, drag = false;
  function reveal(){
    cov.style.transition = 'transform .35s, opacity .35s';
    cov.style.transform = 'translateX(110%)'; cov.style.opacity = 0; cov.style.pointerEvents = 'none';
    $('player').inert = false; boom();
  }
  cov.onpointerdown = e => { drag = true; sx = e.clientX; cov.setPointerCapture(e.pointerId); cov.style.transition = 'none'; };
  cov.onpointermove = e => { if (!drag) return; dx = Math.max(0, e.clientX - sx); cov.style.transform = 'translateX(' + dx + 'px)'; };
  const end = () => {
    if (!drag) return; drag = false;
    if (dx > wrap.offsetWidth * .35) reveal();
    else { cov.style.transition = 'transform .3s'; cov.style.transform = ''; }
    dx = 0;
  };
  cov.onpointerup = end; cov.onpointercancel = end;
  cov.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } };
})();

/* music (keeps playing when she changes views) */
const audio = new Audio(CONFIG.song.file);
audio.loop = true;
$('play').onclick = () => {
  if (audio.paused) {
    audio.play().then(() => {
      $('disc').classList.add('spin'); $('play').textContent = '❚❚ Pause'; $('musicmsg').textContent = '';
    }).catch(() => {
      $('musicmsg').textContent = 'Song not found. Put ' + CONFIG.song.file + ' in the same folder as this page.';
    });
  } else {
    audio.pause(); $('disc').classList.remove('spin'); $('play').textContent = '▶ Play';
  }
};

/* main present */
$('openpresent').onclick = () => {
  $('presentbox').classList.add('open');
  $('openpresent').style.display = 'none';
  boom();
};
$('yes').onclick = $('no').onclick = () => show('v3');
